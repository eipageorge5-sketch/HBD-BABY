<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 🌌 Intro Screen -->
<section id="intro">
  <div class="stars"></div>
  <h1 id="introText"></h1>
  <button id="openBtn">Tap to open your surprise 🎁</button>
</section>

<!-- 💖 Main Card -->
<section id="mainCard" class="hidden">

  <h1 class="title">Happy 21th Birthday My Love 💕</h1>

  <p id="loveMessage"></p>

  <!-- 📸 Gallery -->
  <h2>Our little memories 📸</h2>
  <div class="gallery">
    <div class="photo">Add Photo</div>
    <div class="photo">Add Photo</div>
    <div class="photo">Add Photo</div>
  </div>

  <button id="finalBtn">One last thing… click me ❤️</button>

</section>

<!-- 🎉 Final Message -->
<section id="finalMessage" class="hidden">
  <h1>I LOVE YOU ❤️</h1>
  <p>Forever and always.</p>
</section>

<canvas id="confetti"></canvas>

<script src="script.js"></script>
</body>
</html>
